[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lit-reader"
dynamic = ["version"]
description = "Turn academic papers into offline HTML reading copies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "src/lit_reader/fonts/OFL.txt"]
authors = [{ name = "Robin Kwong" }]
keywords = ["academic papers", "reading", "arxiv", "pdf", "html"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = []

[project.urls]
Repository = "https://github.com/RobinKwong/lit-reader"

[project.scripts]
lit-reader = "lit_reader.core:main"

[tool.hatch.version]
path = "src/lit_reader/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lit_reader"]
